<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>一阶 RC 低通 · EasyAnalog</title>
<style>
:root{color-scheme:light;--ink:#182628;--muted:#58686c;--line:#cfdbd9;--teal:#006d67;--blue:#395ab1;font:16px/1.55 "Inter","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:#f1f5f3}
*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid var(--line);background:white}header div,main{max-width:1090px;margin:auto;padding:17px 24px}header div{display:flex;gap:12px;align-items:center;font-weight:750;letter-spacing:.01em}header svg{background:var(--teal);border-radius:8px;padding:5px}main{padding-top:28px}h1{font-size:clamp(1.6rem,4vw,2.4rem);margin:2px 0 16px}h2{font-size:1.12rem;margin:0 0 10px}.chapter,small,.hint{color:var(--muted)}.chapter{font-size:.9rem}.layout{display:grid;grid-template-columns:minmax(260px,1fr) minmax(0,1.8fr);gap:16px}.card{border:1px solid var(--line);background:white;border-radius:14px;padding:20px;margin-bottom:16px}.field{display:grid;grid-template-columns:1fr 120px;gap:12px;align-items:center;margin:12px 0}input,select,button{font:inherit}input,select{width:100%;border:1px solid #adbfbc;border-radius:6px;padding:7px;color:var(--ink);background:white}button{border:1px solid #8fa5a1;background:white;border-radius:7px;padding:7px 14px;cursor:pointer;color:var(--ink)}:focus-visible{outline:3px solid #d88a32;outline-offset:2px}button[aria-pressed=true]{color:white;background:var(--teal);border-color:var(--teal)}.hint{font-size:.9rem;margin:8px 0}.circuit{width:100%;height:146px;color:var(--ink);background:#f5f8f7;border-radius:8px}.probe{cursor:pointer}.probe circle{fill:white;stroke:var(--teal);stroke-width:3}.probe[aria-pressed=true] circle{fill:#77e3ce}.probe text{fill:#005c56;font-weight:bold}.readouts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.readouts div{padding:10px;background:#edf5f2;border-radius:7px}.readouts small,.readouts strong{display:block}.readouts strong{font-variant-numeric:tabular-nums}.chart{width:100%;display:block;min-height:180px}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.controls select{width:auto}#status{font-size:.9rem;color:var(--muted);min-height:1.6em}.plotHead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.plotHead h2{margin:0}.legend{color:var(--teal);font-size:.9rem}details{margin-top:12px}summary{cursor:pointer}pre{white-space:pre-wrap;background:#f5f8f7;padding:10px}footer{color:var(--muted);font-size:.86rem;padding-bottom:15px}a{color:var(--teal)}@media(max-width:700px){.layout{grid-template-columns:1fr;gap:0}header div,main{padding-left:14px;padding-right:14px}.card{padding:15px}.readouts{grid-template-columns:1fr 1fr}.field{margin:8px 0}}
</style></head><body>
<header><div><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="white" stroke-width="2" d="M1 13h4l3-8 5 15 4-10 2 3h4"/></svg>EasyAnalog</div></header>
<main><div class="chapter">第6章 · 放大器的频率响应</div><h1>一阶 RC 低通</h1>
<div class="layout"><section><div class="card"><h2>电路参数</h2>
<form id="params">
<label class="field">电阻 R（kΩ）<input id="r" type="number" value="1" min="0.01" max="100" step="any" required></label>
<label class="field">电容 C（µF）<input id="c" type="number" value="1" min="0.01" max="100" step="any" required></label>
<label class="field">直流偏置（V）<input id="dc" type="number" value="1" min="-20" max="20" step="any" required></label>
<label class="field">交流峰值（V）<input id="amp" type="number" value="1" min="0.01" max="10" step="any" required></label>
<label class="field">输入频率（Hz）<input id="f" type="number" value="159.155" min="0.001" max="1e9" step="any" required></label>
</form><button type="button" id="cutoff">将探测频率设为截止频率</button>
</div><div class="card"><h2>计算方式</h2><select id="engine" aria-label="计算方式"><option value="spice">ngspice · WebAssembly</option><option value="exact">RC 解析解</option></select><p id="status" role="status"></p><details><summary>查看 SPICE 网表</summary><pre id="net"></pre></details></div></section>
<section><div class="card"><h2>电路与探针</h2><svg class="circuit" viewBox="0 0 450 150" aria-label="RC 低通电路图">
<g stroke="currentColor" stroke-width="2.4" fill="none"><path d="M73 52h66l6-9 8 18 8-18 8 18 8-18 8 18 7-9h123v26m-17 0h34m-34 8h34m-17 0v35H73V96m0-44v9"/><circle cx="73" cy="79" r="18"/><path d="M64 79q4-10 9 0t9 0m140 42v8m-13 0h26m-21 5h16m-12 5h8"/></g>
<g font-size="15" text-anchor="middle" fill="currentColor"><text x="165" y="31">R</text><text x="348" y="89">C</text></g>
<g class="probe" data-probe="in" tabindex="0" role="button" aria-label="测量 Vin"><circle cx="101" cy="52" r="6"/><text x="82" y="34">Vin</text></g><g class="probe" data-probe="out" tabindex="0" role="button" aria-label="测量 Vout"><circle cx="315" cy="52" r="6"/><text x="295" y="34">Vout</text></g>
</svg><div class="controls" style="margin:10px 0"><label for="probe">探针</label><select id="probe"><option value="out">Vout · 输出电压</option><option value="in">Vin · 输入电压</option><option value="i">I(R) · Vin → Vout</option><option value="gnd">GND · 地电压</option></select></div>
<div class="readouts"><div><small>直流工作点</small><strong id="op">—</strong></div><div><small>指定频率 · 峰值</small><strong id="ac">—</strong></div><div><small>指定频率 · 相位</small><strong id="angle">—</strong></div></div></div>
<div class="card" id="waveform">
<h2>电压随时间变化</h2>
<p class="hint"><span style="color:var(--blue)">┄ Vin 输入</span>　<span class="legend">━ Vout 输出</span>　正弦输入的前 3 个周期</p>
<svg id="timeChart" class="chart" viewBox="0 0 620 243" role="img" aria-label="输入与输出电压随时间变化的波形"></svg>
<label for="timeSlider">时间游标</label><input id="timeSlider" type="range" min="0" max="600" value="100" disabled style="padding:0;accent-color:var(--teal)">
<output id="timeReadout" for="timeSlider">—</output>
</div>
<div class="card"><div class="plotHead"><h2>输出频率响应</h2><div class="controls"><button data-mode="mag" aria-pressed="true">幅频</button><button data-mode="phase" aria-pressed="false">相频</button></div></div><p class="hint"><span class="legend">● Vout / Vin</span>　 截止频率 <strong id="fc">—</strong></p>
<svg id="chart" class="chart" viewBox="0 0 620 243" role="img" aria-label="一阶 RC 低通波特图"></svg><p class="hint" id="cursor"></p>
</div></section></div>
<footer>仿真内核使用 <a href="https://github.com/eelab-dev/EEcircuit-engine">EEcircuit-engine / ngspice</a>。解析解适用于图示理想 RC 电路。</footer></main>
<script id="solver" type="text/plain">
let simulator;
const circuit=(p,analysis)=>['EasyAnalog RC low-pass',p.source,'R1 in out '+p.R,'C1 out 0 '+p.C,analysis,'.end'].join('\n');
function trace(result,name){
 const found=result.data.find(row=>row.name.toLowerCase()===name);
 if(!found)throw new Error('缺少仿真输出 '+name);
 return found.values;
}
async function run(p,cmd){
 simulator.setNetList(circuit(p,cmd));
 return simulator.runSim();
}
self.onmessage=async({data:p})=>{
 try{
  if(!simulator){
   const {Simulation}=await import(p.engineURL);
   simulator=new Simulation();await simulator.start();
  }
  const op=await run(p,'.op');
  const sweep=await run(p,'.ac dec 24 '+p.lo+' '+p.hi);
  const sample=await run(p,'.ac lin 1 '+p.f+' '+p.f);
  const output=trace(sweep,'v(out)'),input=trace(sweep,'v(in)'),freq=trace(sweep,'frequency');
  const points=output.map((v,i)=>[freq[i].real,20*Math.log10(Math.hypot(v.real,v.img)/Math.hypot(input[i].real,input[i].img)),(Math.atan2(v.img,v.real)-Math.atan2(input[i].img,input[i].real))*180/Math.PI]);
  const vin=trace(sample,'v(in)')[0],vout=trace(sample,'v(out)')[0];
  const vi=trace(op,'v(in)')[0],vo=trace(op,'v(out)')[0];
  const transient=await run(p,p.tran);
  const times=trace(transient,'time');
  const inputs=trace(transient,'v(in)'),outputs=trace(transient,'v(out)');
  const wave=times.map((time,i)=>[time,inputs[i],outputs[i]]);
  if(wave.length && times[0]>0) wave.unshift([0,vi,vo]);
  self.postMessage({points,volt:[vin,vout],dc:[vi,vo],wave});
 }catch(error){self.postMessage({error:String(error.message||error)});}
};
</script>
<script>
const $=id=>document.getElementById(id);
const controls=$('params');
let mode='mag',result=null,settings=null,worker=null,timer,limit,revision=0,busy=false;
const number=(v,d=3)=>Number(v.toPrecision(d)).toLocaleString('en-US',{maximumFractionDigits:9});
function freqLabel(f){return f>=1e6?number(f/1e6)+' MHz':f>=1000?number(f/1000)+' kHz':number(f)+' Hz'}
function read(){
 if(!controls.checkValidity())return null;
 const R=$('r').valueAsNumber*1e3,C=$('c').valueAsNumber*1e-6,f=$('f').valueAsNumber,fc=1/(2*Math.PI*R*C);
 const dc=$('dc').valueAsNumber,amp=$('amp').valueAsNumber;
 const duration=3/f,step=1/(160*f);
 const source='Vin in 0 DC '+dc+' AC '+amp+' SIN('+dc+' '+amp+' '+f+')';
 const tran='.tran '+step+' '+duration+' 0 '+step;
 return {R,C,dc,amp,f,fc,lo:fc/100,hi:fc*100,duration,source,tran};
}
function exact(p){
 function voltage(f){const x=f/p.fc;return {real:p.amp/(1+x*x),img:-p.amp*x/(1+x*x)}}
 const ratio=p.f/p.fc;
 const wave=Array.from({length:481},(_,i)=>{
  const t=p.duration*i/480,angle=2*Math.PI*p.f*t;
  const vin=p.dc+p.amp*Math.sin(angle);
  // The exponential enforces Vout(0) = DC at the start of the sine wave.
  const response=(Math.sin(angle)+ratio*(Math.expm1(-t/(p.R*p.C))+2*Math.sin(angle/2)**2))/(1+ratio*ratio);
  return [t,vin,p.dc+p.amp*response];
 });
 return {wave,points:Array.from({length:97},(_,i)=>{const f=p.lo*10**(i/24),x=f/p.fc;return [f,-10*Math.log10(1+x*x),-Math.atan(x)*180/Math.PI]}),volt:[{real:p.amp,img:0},voltage(p.f)],dc:[p.dc,p.dc]};
}
function drawWave(){
 const chart=$('timeChart'),slider=$('timeSlider'),output=$('timeReadout');
 slider.disabled=!result;
 if(!result){chart.replaceChildren();output.textContent='—';return}
 const p=settings,wave=result.wave;
 const left=66,width=516,top=24,height=160;
 const x=t=>left+width*t/p.duration;
 const y=v=>top+height*(1-(v-p.dc)/p.amp)/2;
 const unit=p.duration>=1?[1,'s']:p.duration>=1e-3?[1e3,'ms']:p.duration>=1e-6?[1e6,'µs']:[1e9,'ns'];
 const text=(x,y,value,anchor)=>'<text x="'+x+'" y="'+y+'" text-anchor="'+anchor+'" font-size="13" fill="#536566">'+value+'</text>';
 const line=(x1,y1,x2,y2)=>'<line x1="'+x1+'" x2="'+x2+'" y1="'+y1+'" y2="'+y2+'" stroke="#d9e3e0"/>';
 const parts=[text(12,15,'V','start')];
 for(let k=0;k<=4;k++){
  const value=p.dc+p.amp*(1-k/2);
  parts.push(line(left,y(value),left+width,y(value)),text(left-8,y(value)+4,number(value,5),'end'));
 }
 for(let k=0;k<=3;k++){
  const t=k/p.f;
  parts.push(line(x(t),top,x(t),top+height),text(x(t),208,number(t*unit[0],4),'middle'));
 }
 parts.push(text(left+width,232,'时间 ('+unit[1]+')','end'));
 function traceLine(index,style){
  const points=wave.map(row=>x(row[0]).toFixed(2)+','+y(row[index]).toFixed(2)).join(' ');
  return '<polyline fill="none" '+style+' points="'+points+'"/>';
 }
 parts.push(traceLine(1,'stroke="#395ab1" stroke-width="2" stroke-dasharray="6 4"'),traceLine(2,'stroke="#006d67" stroke-width="3"'));
 const t=Number(slider.value)/Number(slider.max)*p.duration;
 let hi=wave.findIndex(row=>row[0]>=t);
 if(hi<0)hi=wave.length-1;
 const a=wave[Math.max(0,hi-1)],b=wave[hi];
 const mix=b[0]>a[0]?Math.min(1,(t-a[0])/(b[0]-a[0])):0;
 const at=i=>a[i]+mix*(b[i]-a[i]);
 parts.push('<line x1="'+x(t)+'" x2="'+x(t)+'" y1="'+top+'" y2="'+(top+height)+'" stroke="#687777" stroke-dasharray="3 3"/>');
 for(const [i,color] of [[1,'#395ab1'],[2,'#006d67']])parts.push('<circle cx="'+x(t)+'" cy="'+y(at(i))+'" r="4" fill="'+color+'"/>');
 chart.innerHTML=parts.join('');
 output.textContent='t = '+number(t*unit[0],5)+' '+unit[1]+'　Vin = '+number(at(1),5)+' V　Vout = '+number(at(2),5)+' V';
}
$('timeSlider').oninput=drawWave;
function draw(){
 drawWave();
 document.querySelectorAll('[data-probe]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.probe===$('probe').value)));
 document.querySelectorAll('[data-mode]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.mode===mode)));
 if(!result){for(const id of ['op','ac','angle'])$(id).textContent='—';$('chart').replaceChildren();$('cursor').textContent='';return}
 const p=settings,[vin,vout]=result.volt,[di,do_]=result.dc,probe=$('probe').value;
 const [v,bias,unit]=probe==='out'?[vout,do_,'V']:probe==='in'?[vin,di,'V']:probe==='i'?[{real:(vin.real-vout.real)*1e3/p.R,img:(vin.img-vout.img)*1e3/p.R},(di-do_)*1e3/p.R,'mA']:[{real:0,img:0},0,'V'];
 $('op').textContent=number(bias)+' '+unit;$('ac').textContent=number(Math.hypot(v.real,v.img),4)+' '+unit;$('angle').textContent=Math.hypot(v.real,v.img)>0?number(Math.atan2(v.img,v.real)*180/Math.PI,4)+'°':'—';
 const phase=mode==='phase',floor=phase?-90:-42,x=f=>65+Math.log10(f/p.lo)*130,y=a=>25+a/floor*166;
 const parts=[],svg=$('chart');
 function line(x1,y1,x2,y2,color,dash=''){parts.push('<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+color+'" stroke-dasharray="'+dash+'"/>')}
 function label(x,y,s,anchor='middle'){parts.push('<text x="'+x+'" y="'+y+'" text-anchor="'+anchor+'" fill="#536566" font-size="13">'+s+'</text>')}
 for(const tick of phase?[0,-30,-60,-90]:[0,-10,-20,-30,-40]){line(65,y(tick),585,y(tick),'#d9e3e0');label(55,y(tick)+4,tick,'end')}
 for(let i=0;i<5;i++){let f=p.lo*10**i;line(x(f),25,x(f),191,'#d9e3e0');label(x(f),213,freqLabel(f))}
 label(16,16,phase?'°':'dB','start');
 parts.push('<polyline fill="none" stroke="#006d67" stroke-width="3" points="'+result.points.map(a=>x(a[0])+','+y(a[phase?2:1])).join(' ')+'"/>');
 const gain=20*Math.log10(Math.hypot(vout.real,vout.img)/Math.hypot(vin.real,vin.img)),deg=(Math.atan2(vout.img,vout.real)-Math.atan2(vin.img,vin.real))*180/Math.PI;
 if(p.f>=p.lo&&p.f<=p.hi){line(x(p.f),25,x(p.f),191,'#395ab1','4 4');parts.push('<circle cx="'+x(p.f)+'" cy="'+y(phase?deg:gain)+'" r="5" fill="#395ab1"/>')}
 svg.innerHTML=parts.join('');
 $('cursor').textContent=freqLabel(p.f)+'　'+number(gain,5)+' dB　'+number(deg,5)+'°';
}
function stopWorker(){clearTimeout(limit);if(worker)worker.terminate();worker=null;busy=false}
function fail(){stopWorker();result=null;draw();$('status').textContent='仿真内核未能完成计算。可以重试，或切换到 RC 解析解。';$('retry').hidden=false}
function update(){
 const id=++revision;clearTimeout(timer);if(busy)stopWorker();
 result=null;settings=read();draw();$('retry').hidden=true;
 if(!settings){$('fc').textContent='—';$('net').textContent='';$('status').textContent='请填写范围内的有效数值。';return}
 const p=settings;$('fc').textContent=freqLabel(p.fc);$('net').textContent=['EasyAnalog RC low-pass',p.source,'R1 in out '+p.R,'C1 out 0 '+p.C,'.op','.ac dec 24 '+p.lo+' '+p.hi,p.tran,'.end'].join('\n');
 if($('engine').value==='exact'){stopWorker();result=exact(p);$('status').textContent='当前读数来自理想 RC 解析解。';draw();return}
 $('status').textContent='正在加载或运行 ngspice…';
 timer=setTimeout(()=>{
 try{
 if(!worker){const url=URL.createObjectURL(new Blob([$('solver').textContent],{type:'text/javascript'}));worker=new Worker(url,{type:'module'});URL.revokeObjectURL(url)}
 busy=true;limit=setTimeout(()=>{if(id===revision)fail()},45000);
 worker.onerror=()=>{if(id===revision)fail()};
 worker.onmessage=({data})=>{if(id!==revision)return;clearTimeout(limit);busy=false;if(data.error||!data.wave?.length||!data.wave.every(row=>row.every(Number.isFinite))||!data.points?.length||!data.points.every(row=>row.every(Number.isFinite))){fail();return}result=data;$('status').textContent='ngspice 已完成工作点、交流扫频与瞬态分析。';draw()};
 worker.postMessage({...p,engineURL:new URL('https://cdn.jsdelivr.net/npm/eecircuit-engine@1.8.0/dist/eecircuit-engine.mjs',location.href).href});
 }catch{fail()}
 },180);
}
const retry=document.createElement('button');retry.id='retry';retry.hidden=true;retry.textContent='重试仿真';$('status').after(retry);retry.onclick=update;
controls.addEventListener('input',update);controls.onsubmit=e=>e.preventDefault();$('engine').onchange=update;$('probe').onchange=draw;
$('cutoff').onclick=()=>{if(read()){$('f').value=Number(read().fc.toPrecision(9));update()}};
document.querySelectorAll('[data-probe]').forEach(el=>{el.onclick=()=>{$('probe').value=el.dataset.probe;draw()};el.onkeydown=e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();el.onclick()}}});
document.querySelectorAll('[data-mode]').forEach(el=>el.onclick=()=>{mode=el.dataset.mode;draw()});
update();
</script></body></html>
