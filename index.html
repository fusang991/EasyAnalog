<style>
:root {
 color-scheme:light; --ink:#182628; --muted:#536769; --line:#cddbd7; --teal:#006d67; --blue:#395ab1;
 font:16px/1.5 "Inter","Microsoft YaHei",system-ui,sans-serif; color:var(--ink); background:#f1f5f3;
}
*{box-sizing:border-box} [hidden]{display:none!important} body{margin:0}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;background:white;border-bottom:1px solid var(--line);padding:4px var(--gutter)}

main{padding:8px var(--gutter)}h1,h2,p{margin:0}h1{font-size:clamp(1.05rem,1.4vw,1.25rem);line-height:1.25}h2{font-size:1.08rem}

.readouts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.readouts div{padding:7px 9px;background:#edf5f2;border-radius:6px}

.result-tabs{display:flex;gap:2px;padding:3px;border-radius:8px;background:#eaf1ee}

.result-tabs [aria-selected=true]{background:var(--teal);color:white}
.chart{display:block;width:100%;height:clamp(255px,36vh,450px)}.hint{margin:6px 0}.legend{color:var(--teal)}
.cursor-row{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:8px}#timeReadout{display:block}.plotHead{margin-top:8px}
input,select,button{font:inherit}input,select{min-width:0;border:1px solid #adbfbc;border-radius:6px;padding:5px 8px;color:var(--ink);background:white}
select{max-width:100%}button{border:1px solid #8fa5a1;background:white;border-radius:7px;padding:5px 12px;cursor:pointer;color:var(--ink)}
button[aria-pressed=true]{color:white;background:var(--teal);border-color:var(--teal)}:focus-visible{outline:3px solid #cf8029;outline-offset:2px}
.parameter-card,.engine-card{grid-column:1/-1}
.parameter-card{padding-block:8px}.parameter-head,.engine-head{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px}
.parameter-head{justify-content:space-between}.parameter-head button{font-size:.85rem;padding:2px 8px}
#params{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px 12px;margin:4px 0 0}
.field{display:grid;gap:4px;font-size:.9rem}.field input{width:100%}#status{margin:6px 0}
summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f8f7;padding:10px}footer{font-size:.85rem;margin-top:12px}a{color:var(--teal)}
@media(min-width:901px){
 .chart{height:clamp(180px,calc(100dvh - 390px),52vh)}
 .circuit{height:clamp(180px,calc(100dvh - 395px),51vh)}
}
@media(max-width:900px){
 .layout{grid-template-columns:minmax(0,1fr)}.circuit{height:clamp(205px,38vw,330px)}.chart{height:clamp(235px,42vw,330px)}
}
@media(max-width:540px){
 header{flex-wrap:wrap;gap:6px}.case-picker{gap:5px;flex:1;justify-content:flex-end;font-size:.86rem}.case-picker select{width:min(47vw,240px)}
 main{padding-top:10px}.layout{gap:8px}.card{padding:10px}.readouts div{padding:6px}.readouts small{font-size:.76rem}
 .result-tabs button{padding:5px 8px}.controls{gap:4px}.probe-head select{max-width:55vw}.chart{height:250px}
}
</style></head><body>
<header><div class="brand"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="white" stroke-width="2" d="M1 13h4l3-8 5 15 4-10 2 3h4"/></svg>EasyAnalog</div><label class="case-picker">切换电路 <select id="case"></select></label></header>
<main><div class="intro"><h1>一阶 RC 低通</h1><span class="chapter">第6章 · 放大器的频率响应</span><p id="caseHint"></p></div>
<div class="layout">
<section class="card parameter-card"><div class="parameter-head"><h2>电路参数</h2><button type="button" id="cutoff">将探测频率设为截止频率</button></div>
<form id="params">
<label class="field"><span id="rLabel">电阻 R（kΩ）</span><input id="r" type="number" value="1" min="0.01" max="100" step="any" required></label>
<label class="field"><span id="cLabel">电容 C（µF）</span><input id="c" type="number" value="1" min="0.01" max="100" step="any" required></label>
<label class="field">直流偏置（V）<input id="dc" type="number" value="1" min="-20" max="20" step="any" required></label>
<label class="field">交流峰值（V）<input id="amp" type="number" value="1" min="0.01" max="10" step="any" required></label>
<label class="field">输入频率（Hz）<input id="f" type="number" value="159.155" min="0.001" max="1e9" step="any" required></label>
<label class="field" id="supplyField" style="display:none">电源 VDD（V）<input id="supply" type="number" value="5" min="1" max="10" step="any" required disabled></label>
</form></section>
<section class="card probe-card"><div class="probe-head"><h2>电路与探针</h2><div class="controls"><label for="probe">探针</label><select id="probe"><option value="out">Vout · 输出电压</option><option value="in">Vin · 输入电压</option><option value="i">I(R) · Vin → Vout</option><option value="gnd">GND · 地电压</option></select></div></div>
<svg class="circuit" viewBox="0 0 450 165" role="group" aria-label="电路与可选探针"></svg>
<div class="readouts"><div><small>直流工作点</small><strong id="op">—</strong></div><div><small>指定频率 · 峰值</small><strong id="ac">—</strong></div><div><small>指定频率 · 相位</small><strong id="angle">—</strong></div></div></section>
<section class="card results-card" id="waveform">
<div class="result-head"><h2 id="results-heading">仿真结果</h2>
<div class="result-tabs" role="tablist" aria-labelledby="results-heading">
<button type="button" role="tab" id="time-tab" aria-controls="time-panel" aria-selected="true">时域波形</button>
<button type="button" role="tab" id="freq-tab" aria-controls="freq-panel" aria-selected="false" tabindex="-1">频率响应</button>
</div></div>
<div id="time-panel" role="tabpanel" aria-labelledby="time-tab">
<p class="hint"><span style="color:var(--blue)">┄ Vin 输入</span>　<span class="legend">━ Vout 输出</span>　正弦输入的前 3 个周期</p>
<svg id="timeChart" class="chart" viewBox="0 0 620 243" role="img" aria-label="输入与输出电压随时间变化的波形"></svg>
<div class="cursor-row"><label for="timeSlider">时间游标</label><input id="timeSlider" type="range" min="0" max="600" value="100" disabled style="padding:0;accent-color:var(--teal)">
</div><output id="timeReadout" for="timeSlider">—</output>
</div>
<div role="tabpanel" id="freq-panel" aria-labelledby="freq-tab" hidden><div class="plotHead"><div class="controls"><button data-mode="mag" aria-pressed="true">幅频</button><button data-mode="phase" aria-pressed="false">相频</button></div><p class="hint"><span class="legend">● Vout / Vin</span>　 <span id="freqCaption">截止频率</span> <strong id="fc">—</strong></p></div>
<svg id="chart" class="chart" viewBox="0 0 620 243" role="img" aria-label="输出与输入的幅频或相频响应"></svg><p class="hint" id="cursor"></p>
</div></section>
<section class="card engine-card"><div class="engine-head"><h2>计算方式</h2><select id="engine" aria-label="计算方式"><option value="spice">ngspice · WebAssembly</option><option value="exact">RC 解析解</option></select></div><p class="hint" id="modelNote" hidden>教学模型：长沟道 NMOS，阈值 0.7 V，体端接地。CL 为外接负载电容。</p><p id="status" role="status"></p><details><summary>查看 SPICE 网表</summary><pre id="net"></pre></details></section>
</div>
<footer>仿真内核使用 <a href="https://github.com/eelab-dev/EEcircuit-engine">EEcircuit-engine / ngspice</a>。解析解适用于图示理想 RC 电路。</footer></main>
<script src="./circuits.js"></script>
<script id="solver" type="text/plain">
let simulator;
const circuit=(p,analysis)=>[p.title,p.source,...p.elements,analysis,'.end'].join('\n');
function trace(result,name){
 const found=result.data.find(row=>row.name.toLowerCase()===name);
 if(!found)throw new Error('缺少仿真输出 '+name);
 return found.values;
}
async function run(p,cmd){
 simulator.setNetList(circuit(p,cmd));
 return simulator.runSim();
}
self.onmessage=async({data:p})=>{
 try{
  if(!simulator){
   const {Simulation}=await import(p.engineURL);
   simulator=new Simulation();await simulator.start();
  }
  const op=await run(p,'.op');
  const sweep=await run(p,'.ac dec 24 '+p.lo+' '+p.hi);
  const sample=await run(p,'.ac lin 1 '+p.f+' '+p.f);
  const output=trace(sweep,'v(out)'),input=trace(sweep,'v(in)'),freq=trace(sweep,'frequency');
  const points=output.map((v,i)=>[freq[i].real,20*Math.log10(Math.hypot(v.real,v.img)/Math.hypot(input[i].real,input[i].img)),(Math.atan2(v.img,v.real)-Math.atan2(input[i].img,input[i].real))*180/Math.PI]).filter(row=>row.every(Number.isFinite));
  const vin=trace(sample,'v(in)')[0],vout=trace(sample,'v(out)')[0];
  const vi=trace(op,'v(in)')[0],vo=trace(op,'v(out)')[0];
  const transient=await run(p,p.tran);
  const times=trace(transient,'time');
  const inputs=trace(transient,'v(in)'),outputs=trace(transient,'v(out)');
  const wave=times.map((time,i)=>[time,inputs[i],outputs[i]]);
  if(wave.length && times[0]>0) wave.unshift([0,vi,vo]);
  self.postMessage({points,volt:[vin,vout],dc:[vi,vo],wave});
 }catch(error){self.postMessage({error:String(error.message||error)});}
};
</script>
<script>
const $=id=>document.getElementById(id);
const controls=$('params');
let mode='mag',result=null,settings=null,worker=null,timer,limit,revision=0,busy=false;
const number=(v,d=3)=>Number(v.toPrecision(d)).toLocaleString('en-US',{maximumFractionDigits:9});
function freqLabel(f){return f>=1e6?number(f/1e6)+' MHz':f>=1000?number(f/1000)+' kHz':number(f)+' Hz'}
function read(){
 if(!controls.checkValidity())return null;
 const R=$('r').valueAsNumber*1e3,C=$('c').valueAsNumber*active.capacitorScale,f=$('f').valueAsNumber,fc=1/(2*Math.PI*R*C);
 const dc=$('dc').valueAsNumber,amp=$('amp').valueAsNumber;
 const duration=3/f,step=1/(160*f);
 const supply=$('supply').valueAsNumber;
 const source='Vin in 0 DC '+dc+' AC '+amp+' SIN('+dc+' '+amp+' '+f+')';
 const tran='.tran '+step+' '+duration+' 0 '+step;
 const p={R,C,dc,amp,f,fc,lo:fc/100,hi:fc*100,duration,source,tran,supply,title:'EasyAnalog '+$('case').value};
 p.elements=active.net(p);
 return p;
}
function exact(p){
 const high=$('case').value==='highpass';
 function voltage(f){
  const x=f/p.fc,scale=p.amp/(1+x*x);
  return high ? {real:scale*x*x,img:scale*x} : {real:scale,img:-scale*x};
 }
 const ratio=p.f/p.fc;
 const wave=Array.from({length:481},(_,i)=>{
  const t=p.duration*i/480,angle=2*Math.PI*p.f*t;
  const vin=p.dc+p.amp*Math.sin(angle);
  // The exponential enforces Vout(0) = DC at the start of the sine wave.
  const response=(Math.sin(angle)+ratio*(Math.expm1(-t/(p.R*p.C))+2*Math.sin(angle/2)**2))/(1+ratio*ratio);
  return [t,vin,high?p.amp*(Math.sin(angle)-response):p.dc+p.amp*response];
 });
 return {wave,points:Array.from({length:97},(_,i)=>{const f=p.lo*10**(i/24),x=f/p.fc;return high?[f,-10*Math.log10(1+1/(x*x)),Math.atan(1/x)*180/Math.PI]:[f,-10*Math.log10(1+x*x),-Math.atan(x)*180/Math.PI]}),volt:[{real:p.amp,img:0},voltage(p.f)],dc:[p.dc,high?0:p.dc]};
}
function plotFrame(svg){
 const w=svg.clientWidth,h=svg.clientHeight;
 svg.setAttribute('viewBox','0 0 '+w+' '+h);
 const left=w<450?44:58, right=w-(w<450?28:36), top=19, bottom=h-43;
 return {left,right,width:right-left,top,bottom,height:bottom-top};
}
function drawWave(){
 const chart=$('timeChart'),slider=$('timeSlider'),output=$('timeReadout');
 slider.disabled=!result;
 if(!result){chart.replaceChildren();output.textContent='—';return}
 const p=settings,wave=result.wave;
 if($('time-panel').hidden)return;
 const {left,width,top,height,bottom}=plotFrame(chart);
 const x=t=>left+width*t/p.duration;
 const low=Math.min(p.dc-p.amp,...wave.map(row=>row[2]));
 const high=Math.max(p.dc+p.amp,...wave.map(row=>row[2]));
 const y=v=>top+height*(high-v)/(high-low);
 const unit=p.duration>=1?[1,'s']:p.duration>=1e-3?[1e3,'ms']:p.duration>=1e-6?[1e6,'µs']:[1e9,'ns'];
 const text=(x,y,value,anchor)=>'<text x="'+x+'" y="'+y+'" text-anchor="'+anchor+'" font-size="13" fill="#536566">'+value+'</text>';
 const line=(x1,y1,x2,y2)=>'<line x1="'+x1+'" x2="'+x2+'" y1="'+y1+'" y2="'+y2+'" stroke="#d9e3e0"/>';
 const parts=[text(12,15,'V','start')];
 for(let k=0;k<=4;k++){
  const value=high-(high-low)*k/4;
  parts.push(line(left,y(value),left+width,y(value)),text(left-8,y(value)+4,number(value,5),'end'));
 }
 for(let k=0;k<=3;k++){
  const t=k/p.f;
  parts.push(line(x(t),top,x(t),top+height),text(x(t),bottom+20,number(t*unit[0],4),'middle'));
 }
 parts.push(text(left+width,bottom+39,'时间 ('+unit[1]+')','end'));
 function traceLine(index,style){
  const points=wave.map(row=>x(row[0]).toFixed(2)+','+y(row[index]).toFixed(2)).join(' ');
  return '<polyline fill="none" '+style+' points="'+points+'"/>';
 }
 parts.push(traceLine(1,'stroke="#395ab1" stroke-width="2" stroke-dasharray="6 4"'),traceLine(2,'stroke="#006d67" stroke-width="3"'));
 const t=Number(slider.value)/Number(slider.max)*p.duration;
 let hi=wave.findIndex(row=>row[0]>=t);
 if(hi<0)hi=wave.length-1;
 const a=wave[Math.max(0,hi-1)],b=wave[hi];
 const mix=b[0]>a[0]?Math.min(1,(t-a[0])/(b[0]-a[0])):0;
 const at=i=>a[i]+mix*(b[i]-a[i]);
 parts.push('<line x1="'+x(t)+'" x2="'+x(t)+'" y1="'+top+'" y2="'+(top+height)+'" stroke="#687777" stroke-dasharray="3 3"/>');
 for(const [i,color] of [[1,'#395ab1'],[2,'#006d67']])parts.push('<circle cx="'+x(t)+'" cy="'+y(at(i))+'" r="4" fill="'+color+'"/>');
 chart.innerHTML=parts.join('');
 output.textContent='t = '+number(t*unit[0],5)+' '+unit[1]+'　Vin = '+number(at(1),5)+' V　Vout = '+number(at(2),5)+' V';
}
$('timeSlider').oninput=drawWave;
function draw(){
 drawWave();
 document.querySelectorAll('[data-probe]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.probe===$('probe').value)));
 document.querySelectorAll('[data-mode]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.mode===mode)));
 if(!result){for(const id of ['op','ac','angle'])$(id).textContent='—';$('chart').replaceChildren();$('cursor').textContent='';return}
 const p=settings,[vin,vout]=result.volt,[di,do_]=result.dc,probe=$('probe').value;
 const nodes={in:[vin,di],out:[vout,do_],gnd:[{real:0,img:0},0],vdd:[{real:0,img:0},p.supply]};
 let [v,bias]=nodes[probe]||nodes.gnd;
 let unit='V';
 if(probe==='i'){
  const [a,b]=active.resistorNodes.map(name=>nodes[name]);
  const scale=1000/p.R;
  v={real:(a[0].real-b[0].real)*scale,img:(a[0].img-b[0].img)*scale};
  bias=(a[1]-b[1])*scale;
  unit='mA';
 }
 $('op').textContent=number(bias)+' '+unit;$('ac').textContent=number(Math.hypot(v.real,v.img),4)+' '+unit;$('angle').textContent=Math.hypot(v.real,v.img)>0?number(Math.atan2(v.img,v.real)*180/Math.PI,4)+'°':'—';
 if($('freq-panel').hidden)return;
 const frame=plotFrame($('chart'));
 const phase=mode==='phase',index=phase?2:1;
 const values=result.points.map(row=>row[index]),stride=phase?30:10;
 const bottom=Math.floor(Math.min(0,...values)/stride)*stride;
 const top=Math.max(bottom+stride,Math.ceil(Math.max(0,...values)/stride)*stride);
 const x=f=>frame.left+Math.log10(f/p.lo)*frame.width/4,y=a=>frame.top+(top-a)/(top-bottom)*frame.height;
 const parts=[],svg=$('chart');
 function line(x1,y1,x2,y2,color,dash=''){parts.push('<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+color+'" stroke-dasharray="'+dash+'"/>')}
 function label(x,y,s,anchor='middle'){parts.push('<text x="'+x+'" y="'+y+'" text-anchor="'+anchor+'" fill="#536566" font-size="13">'+s+'</text>')}
 for(let tick=bottom;tick<=top;tick+=stride){line(frame.left,y(tick),frame.right,y(tick),'#d9e3e0');label(frame.left-8,y(tick)+4,tick,'end')}
 for(let i=0;i<5;i++){let f=p.lo*10**i;line(x(f),frame.top,x(f),frame.bottom,'#d9e3e0');label(x(f),frame.bottom+20,freqLabel(f))}
 label(16,16,phase?'°':'dB','start');
 parts.push('<polyline fill="none" stroke="#006d67" stroke-width="3" points="'+result.points.map(a=>x(a[0])+','+y(a[phase?2:1])).join(' ')+'"/>');
 const gain=20*Math.log10(Math.hypot(vout.real,vout.img)/Math.hypot(vin.real,vin.img)),deg=(Math.atan2(vout.img,vout.real)-Math.atan2(vin.img,vin.real))*180/Math.PI;
 if(Number.isFinite(gain)&&p.f>=p.lo&&p.f<=p.hi){line(x(p.f),frame.top,x(p.f),frame.bottom,'#395ab1','4 4');parts.push('<circle cx="'+x(p.f)+'" cy="'+y(phase?deg:gain)+'" r="5" fill="#395ab1"/>')}
 svg.innerHTML=parts.join('');
 $('cursor').textContent=Number.isFinite(gain)?freqLabel(p.f)+'　'+number(gain,5)+' dB　'+number(deg,5)+'°':freqLabel(p.f)+'　小信号输出为零';
}
function stopWorker(){clearTimeout(limit);if(worker)worker.terminate();worker=null;busy=false}
function fail(){stopWorker();result=null;draw();$('status').textContent='仿真未完成，请检查参数后重试。';$('retry').hidden=false}
function update(){
 const id=++revision;clearTimeout(timer);if(busy)stopWorker();
 result=null;settings=read();draw();$('retry').hidden=true;
 if(!settings){$('fc').textContent='—';$('net').textContent='';$('status').textContent='请填写范围内的有效数值。';return}
 const p=settings;$('fc').textContent=active.mos?freqLabel(p.lo)+' – '+freqLabel(p.hi):freqLabel(p.fc);$('net').textContent=[p.title,p.source,...p.elements,'.op','.ac dec 24 '+p.lo+' '+p.hi,p.tran,'.end'].join('\n');
 if($('engine').value==='exact'){stopWorker();result=exact(p);$('status').textContent='当前读数来自理想 RC 解析解。';draw();return}
 $('status').textContent='正在加载或运行 ngspice…';
 timer=setTimeout(()=>{
 try{
 if(!worker){const url=URL.createObjectURL(new Blob([$('solver').textContent],{type:'text/javascript'}));worker=new Worker(url,{type:'module'});URL.revokeObjectURL(url)}
 busy=true;limit=setTimeout(()=>{if(id===revision)fail()},45000);
 worker.onerror=()=>{if(id===revision)fail()};
 worker.onmessage=({data})=>{if(id!==revision)return;clearTimeout(limit);busy=false;if(data.error||!data.wave?.length||!data.wave.every(row=>row.every(Number.isFinite))||!Array.isArray(data.points)||!data.points.every(row=>row.every(Number.isFinite))){fail();return}result=data;$('status').textContent='ngspice 已完成工作点、交流扫频与瞬态分析。';draw()};
 worker.postMessage({...p,engineURL:new URL('https://cdn.jsdelivr.net/npm/eecircuit-engine@1.8.0/dist/eecircuit-engine.mjs',location.href).href});
 }catch{fail()}
 },180);
}
const retry=document.createElement('button');retry.id='retry';retry.hidden=true;retry.textContent='重试仿真';$('status').after(retry);retry.onclick=update;
controls.addEventListener('input',update);controls.onsubmit=e=>e.preventDefault();$('engine').onchange=update;$('probe').onchange=draw;
$('cutoff').onclick=()=>{if(read()){$('f').value=Number(read().fc.toPrecision(9));update()}};
function wireProbes(){document.querySelectorAll('[data-probe]').forEach(el=>{el.onclick=()=>{$('probe').value=el.dataset.probe;draw()};el.onkeydown=e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();el.onclick()}}});}
document.querySelectorAll('[data-mode]').forEach(el=>el.onclick=()=>{mode=el.dataset.mode;draw()});
const resultTabs=Array.from(document.querySelectorAll('.result-tabs [role=tab]'));
function selectResultTab(tab){
 for(const item of resultTabs){
  const selected=item===tab;
  item.setAttribute('aria-selected',String(selected));
  item.tabIndex=selected?0:-1;
  $(item.getAttribute('aria-controls')).hidden=!selected;
 }
 draw();
}
for(const tab of resultTabs){
 tab.onclick=()=>selectResultTab(tab);
 tab.onkeydown=event=>{
  const index={Home:0,End:1,ArrowLeft:1-resultTabs.indexOf(tab),ArrowRight:1-resultTabs.indexOf(tab)}[event.key];
  if(index===undefined)return;
  event.preventDefault();
  resultTabs[index].focus();
  selectResultTab(resultTabs[index]);
 };
}
const plotResize=new ResizeObserver(()=>draw());
plotResize.observe($('timeChart'));
plotResize.observe($('chart'));
let active;
const caseSelect=$('case');
for(const [id,entry] of Object.entries(caseBook))caseSelect.add(new Option(entry.name,id));
function selectCase(){
 const id=caseSelect.value;
 active=caseBook[id];
 const url=new URL(location.href);
 url.searchParams.set('case',id);
 if(location.protocol!=='file:')history.replaceState(null,'',url);
 document.title=active.name+' · EasyAnalog';
 document.querySelector('h1').textContent=active.name;
 document.querySelector('.chapter').textContent=active.chapter;
 $('caseHint').textContent=active.hint;
 $('rLabel').textContent=(active.resistorLabel||'电阻 R')+'（kΩ）';
 $('cLabel').textContent=(active.mos?'负载电容 CL':'电容 C')+'（'+active.capacitorUnit+'）';
 for(const [i,key] of ['r','c','dc','amp','f'].entries())$(key).value=active.defaults[i];
 $('modelNote').hidden=!active.mos;
 $('supply').disabled=!active.mos;
 $('supply').value=5;
 $('supplyField').style.display=active.mos?'grid':'none';
 $('cutoff').hidden=!!active.mos;
 $('freqCaption').textContent=active.mos?'扫频范围':'截止频率';
 $('engine').querySelector('[value=exact]').disabled=!!active.mos;
 if(active.mos)$('engine').value='spice';
 const probes=[['out','Vout · 输出电压'],['in','Vin · 输入电压'],['i',active.currentLabel],['gnd','GND · 地电压']];
 if(active.mos)probes.push(['vdd','VDD · 电源电压']);
 $('probe').replaceChildren(...probes.map(([key,name])=>new Option(name,key)));
 const circuit=document.querySelector('.circuit');
 circuit.setAttribute('viewBox',active.mos?'76 -32 305 202':'42 4 324 154');
 circuit.innerHTML=schematic(id);
 wireProbes();
 $('timeSlider').value=100;
 update();
}
const requested=new URL(location.href).searchParams.get('case');
caseSelect.value=Object.hasOwn(caseBook,requested)?requested:'lowpass';
caseSelect.onchange=selectCase;
selectCase();
</script></body></html>
